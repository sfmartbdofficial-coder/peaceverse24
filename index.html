    <script>
      // Suppress harmless Vite HMR WebSocket errors in AI Studio iframe environment
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.toString().includes('WebSocket'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('ws'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        try {
          const OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              const ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
              ws.addEventListener('error', function(err) {
                if (err && typeof err.stopImmediatePropagation === 'function') {
                  err.stopImmediatePropagation();
                }
              });
              return ws;
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
