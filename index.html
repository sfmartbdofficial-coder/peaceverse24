    <script>
      (function() {
        try {
          var saved = window.localStorage.getItem('peaceverse-theme');
          var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'dark' ? 'dark' : (mode === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>

    <script>
      // 1. Enforce HTTPS in non-local environments
      (function() {
        try {
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
          if (window.location.protocol !== 'https:' && !isLocal) {
            window.location.replace('https://' + window.location.href.slice(window.location.protocol.length + 2));
          }
        } catch (e) {}

        // 2. Console warning for API key protection
        console.warn('Set API keys in Vercel Environment Variables, not in code');

        // 3. Block & strip exposed API keys in URL query/hash
        try {
          var rawUrl = window.location.search + ' ' + window.location.hash;
          var keyPattern = /(api[_-]?key|gemini[_-]?api[_-]?key|secret|access_token)=[^&#]+|AIza[0-9A-Za-z_-]{20,}/i;
          if (keyPattern.test(rawUrl)) {
            console.error('SECURITY BLOCK: API key detected in URL and stripped immediately.');
            window.__peaceverseUrlKeyBlocked = true;
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {}
      })();

      // Suppress harmless Vite HMR WebSocket errors in AI Studio iframe environment
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (event.reason.message?.includes('WebSocket') || event.reason.toString().includes('WebSocket'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('ws'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        try {
          const OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              const ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
              ws.addEventListener('error', function(err) {
                if (err && typeof err.stopImmediatePropagation === 'function') {
                  err.stopImmediatePropagation();
                }
              });
              return ws;
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
