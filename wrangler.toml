name = "peaceverse24"
main = "./worker/index.ts"
compatibility_date = "2025-11-01"
keep_vars = true

[vars]
RESEND_FROM_EMAIL = "PeaceVerse24 <noreply@peaceverse24.com>"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Optional: Bind a Cloudflare R2 bucket named "peaceverse24-media" to store & stream multi-GB 2-hour+ videos directly from peaceverse24.com
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "peaceverse24-media"

