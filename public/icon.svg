<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141b17" />
      <stop offset="65%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#060609" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#0a8a4b" />
      <stop offset="100%" stop-color="#056938" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0a8a4b" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Dark background (#0a0a0f) -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)" />

  <!-- Subtle glowing green border ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Inner Islamic crescent accent at top -->
  <path d="M 274 78 A 42 42 0 1 0 274 156 A 33 33 0 1 1 274 78 Z" fill="#22c55e" />
  <circle cx="288" cy="117" r="7" fill="#4ade80" />

  <!-- Green emblem pill behind P24 -->
  <rect x="76" y="182" width="360" height="170" rx="44" fill="url(#emeraldGrad)" />
  <rect x="82" y="188" width="348" height="158" rx="38" fill="#0a0a0f" fill-opacity="0.22" />

  <!-- Bold P24 Typography -->
  <text x="256" y="302" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="132" fill="#ffffff" text-anchor="middle" letter-spacing="4">P24</text>

  <!-- Subtle Peaceverse24 emerald underline bar -->
  <rect x="166" y="384" width="180" height="10" rx="5" fill="#0a8a4b" />
  <text x="256" y="434" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="30" fill="#22c55e" text-anchor="middle" letter-spacing="3">PEACEVERSE</text>
</svg>
